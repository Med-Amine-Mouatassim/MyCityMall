<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migration Magasins - MyCityMall</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f0f0f; color: #fff; margin: 0; padding: 30px; }
        .card { background: #1b1b1b; border: 1px solid #333; border-radius: 12px; padding: 20px; max-width: 700px; margin: 0 auto; }
        button { background: #00bcd4; color: #000; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; }
        .log { margin-top: 15px; font-size: 0.9rem; color: #ccc; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Migration des magasins (sport.json -> Firestore)</h2>
        <p>Assure-toi d'etre connecte avec un compte autorise.</p>
        <button id="migrate-btn">Lancer la migration</button>
        <div id="status" class="log"></div>
    </div>

    <script type="module">
        import { db, auth } from './config/firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const btn = document.getElementById('migrate-btn');
        const status = document.getElementById('status');

        let ready = false;
        onAuthStateChanged(auth, (user) => {
            ready = !!user;
            if (!ready) {
                status.textContent = "Connecte-toi pour migrer.";
            } else {
                status.textContent = "Pret a migrer.";
            }
        });

        btn.addEventListener('click', async () => {
            if (!ready) {
                status.textContent = "Connexion requise.";
                return;
            }
            status.textContent = "Migration en cours...";
            try {
                const res = await fetch('../fashion/fashion.json');
                const shops = await res.json();
                let count = 0;
                for (const shop of shops) {
                    if (!shop || !shop.id_magasin) continue;
                    const docRef = doc(db, "magasins", shop.id_magasin);
                    const payload = { ...shop, categorie: "sport" };
                    await setDoc(docRef, payload, { merge: true });
                    count += 1;
                }
                status.textContent = `Migration terminee: ${count} magasins.`;
            } catch (e) {
                console.error(e);
                status.textContent = "Erreur pendant la migration.";
            }
        });
    </script>
</body>
</html>
